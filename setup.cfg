[metadata]
name = vibe-reactor-console
version = attr: devos.__version__
description = A cinematic terminal cockpit for coding, agents, live signals and ASCII arcade games.
url = https://github.com/wotori/vibe-reactor-console
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Environment :: Console :: Curses
    Programming Language :: Python :: 3
    Operating System :: MacOS
    Operating System :: POSIX :: Linux

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = devos*

[options.package_data]
devos = snippets/*.txt

[options.entry_points]
console_scripts =
    vibe-reactor-console = devos.cli:main
    devos = devos.cli:main
